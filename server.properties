# Infdev+ dedicated server configuration
# Generated 2026-08-22. Every key below is one the server actually reads;
# the value shown is the server's own default unless noted.

# --- network ---
server-port=25565
server-ip=
max-players=20
view-distance=10
motd=Yup... still an infdev+ server
server-name=An Infdev+ Server

# --- accounts / access ---
# online-mode=true now performs REAL account verification against Mojang's
# current endpoint (sessionserver.mojang.com/session/minecraft/hasJoined).
#
# It requires ALL of the following, or nobody can join:
#   1. Every player uses the patched client jar (v4 or later).
#   2. Every player launches with a Microsoft account in Prism, NOT offline mode.
#   3. Every player owns a genuine paid Minecraft: Java Edition account.
#
# Set this to false to go back to letting anyone in under any username.
online-mode=true

# Strongly recommended even with online-mode on: it limits the server to people
# you have actually invited. Put one username per line in white-list.txt.
white-list=false

# --- world ---
level-name=world
level-seed=
world-type=DEFAULT
generate-structures=true
full-height=true
allow-nether=true

# --- gameplay ---
gamemode=0
difficulty-setting=1
pvp=true
# MUST be true if anyone plays in creative or otherwise flies. The server kicks
# any player who hasn't moved downward for 80 ticks (4 seconds) with
# "was kicked for floating too long!", which makes flying impossible otherwise.
allow-flight=true
spawn-animals=true
spawn-monsters=true
spawn-protection-radius=-1

# --- server behaviour ---
autosave-interval-ticks=256
quit-server-on-exception=false
